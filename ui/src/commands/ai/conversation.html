<div id="page-conversation" class="page conversation-page hidden">
  <header class="conversation-topbar">
    <div class="conversation-topbar-side">
      <button type="button" class="conversation-icon-button" id="btn-conversation-back" title="返回快速模式" aria-label="返回快速模式">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button type="button" class="conversation-icon-button" id="btn-conversation-pin" title="置顶窗口" aria-label="置顶窗口" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 4 6 6-3 1-4 4-1 5-2-2-2-2 5-1 4-4Z"/><path d="m4 20 6-6"/></svg>
      </button>
    </div>
    <div class="conversation-heading"><span>对话</span><small>快速模式</small></div>
    <div class="conversation-topbar-side conversation-topbar-actions">
      <button type="button" class="conversation-icon-button" id="btn-conversation-new" title="新对话" aria-label="新对话">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>
      </button>
      <button type="button" class="conversation-icon-button" id="btn-conversation-history" title="历史" aria-label="历史">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
      </button>
    </div>
  </header>

  <aside class="conversation-history-drawer" id="conversation-history-drawer" aria-hidden="true">
    <div class="conversation-history-head">
      <span>历史对话</span>
      <button type="button" class="conversation-icon-button" id="btn-conversation-history-close" title="收起历史" aria-label="收起历史">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
    <div class="conversation-list conversation-drawer-list" id="conversation-drawer-list"></div>
  </aside>

  <main class="conversation-log" id="conversation-thread-host" aria-live="polite"></main>
  <button type="button" class="conversation-jump-bottom" id="conversation-jump-bottom" title="回到底部" aria-label="回到底部" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>

  <form class="conversation-composer-wrap" id="conversation-form">
    <div class="conversation-composer">
      <div class="conversation-attachments" id="conversation-attachments" hidden></div>
      <div class="conversation-input-row">
        <span class="conversation-file-prefix" id="conversation-file-prefix" hidden>File:</span>
        <textarea id="conversation-input" rows="1" placeholder="发消息..." aria-label="消息内容"></textarea>
      </div>
      <div class="conversation-composer-tools">
        <input type="file" id="conversation-file-input" multiple hidden />
        <button type="button" class="conversation-add-button" id="btn-conversation-attach" title="添加附件" aria-label="添加附件">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <span class="conversation-separator"></span>
        <button type="button" class="conversation-quick-button conversation-web-button" id="conversation-web-button" title="联网搜索" aria-label="联网搜索" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M4 11h14M11 4a11 11 0 0 1 0 14M11 4a11 11 0 0 0 0 14"/></svg>
          <span>联网</span>
        </button>
        <button type="button" class="stt-mic-btn" id="btn-stt-conversation" title="语音输入" aria-label="语音输入">🎤</button>
        <div class="conversation-input-actions">
          <div class="conversation-model-picker">
            <button type="button" class="conversation-model-button" id="conversation-model-button" aria-haspopup="menu" aria-expanded="false">
              <span id="conversation-model-name">默认模型 · 中</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
            </button>
            <div class="conversation-model-menu" id="conversation-model-menu" role="menu"></div>
          </div>
          <button type="submit" class="conversation-send-button" id="conversation-send" aria-label="发送" title="发送" disabled>
            <svg class="conversation-send-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7M12 5v14"/></svg>
            <svg class="conversation-stop-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
